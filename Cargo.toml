[package]
name = "ude"
version = "0.1.0"
edition = "2024"
authors = ["Dennis Kim <d10475u5@outlook.com>"]
description = "Universal Development Environment & Configuration Engine"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
minijinja = { version = "2.7", features = ["loader"] }
walkdir = "2.5"
sha2 = "0.10"
which = "7.0"
regex = "1.11"
colored = "3.0"
tempfile = "3.17"
directories = "6.0"
similar = "2.7"

[dev-dependencies]
proptest = "1.6"
