# The vendored gitleaks rules (upstream v8.30.1, byte-identical) carry gitleaks' own
# allowlist of public example Google API keys. The file's SHA-256 is pinned in
# src/sanitizer/gitleaks.rs and checked by a test, so any edit to it fails the build.
paths-ignore:
  - "src/sanitizer/rules/gitleaks.toml"
