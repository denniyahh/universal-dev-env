# cargo-deny policy for ude. Run with `mise run supply-chain` (pinned cargo-deny,
# see mise.toml). Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Empty = every target, so Windows-only and other cfg-gated dependencies are checked too.
targets = []
all-features = false
no-default-features = false

[advisories]
# cargo-deny's defaults apply; an ignored advisory must be listed here with a reason.
ignore = []

[licenses]
# Exactly the licenses the current dependency tree needs (`cargo deny list`). A new
# license must be added here on purpose, not accepted silently.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
# syn 2 and 3 coexist today; duplicates are reported, not refused.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
# crates.io only: any other registry or git dependency is refused.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
